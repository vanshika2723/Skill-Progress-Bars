<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Skills | Task 29</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <p class="tag">✦ TASK 29</p>
        <h1>My Skills 🌷</h1>
        <p class="subtitle">
            A little progress every day makes a big difference.
        </p>
    </header>


    <!-- Skills Section -->
    <main class="skills-section">

        <div class="section-title">
            <span>♡</span>
            <h2>Skills I’ve Learned</h2>
            <span>♡</span>
        </div>

        <p class="section-text">
            Here is a quick look at my current technical skills.
        </p>


        <div class="skills-container">

            <!-- HTML -->
            <div class="skill-card">
                <div class="skill-info">
                    <span>💻 HTML</span>
                    <span>90%</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar"
                         data-progress="90"></div>
                </div>
            </div>


            <!-- CSS -->
            <div class="skill-card">
                <div class="skill-info">
                    <span>🎨 CSS</span>
                    <span>85%</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar"
                         data-progress="85"></div>
                </div>
            </div>


            <!-- JavaScript -->
            <div class="skill-card">
                <div class="skill-info">
                    <span>⚡ JavaScript</span>
                    <span>75%</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar"
                         data-progress="75"></div>
                </div>
            </div>


            <!-- React -->
            <div class="skill-card">
                <div class="skill-info">
                    <span>⚛️ React</span>
                    <span>70%</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar"
                         data-progress="70"></div>
                </div>
            </div>


            <!-- Node -->
            <div class="skill-card">
                <div class="skill-info">
                    <span>🟢 Node.js</span>
                    <span>65%</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar"
                         data-progress="65"></div>
                </div>
            </div>


            <!-- MongoDB -->
            <div class="skill-card">
                <div class="skill-info">
                    <span>🗄️ MongoDB</span>
                    <span>60%</span>
                </div>

                <div class="progress-track">
                    <div class="progress-bar"
                         data-progress="60"></div>
                </div>
            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        Made with ♡ while learning web development
    </footer>


    <script src="script.js"></script>

</body>
</html>
